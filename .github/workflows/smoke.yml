name: Smoke test

on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install playwright && npx playwright install --with-deps chromium
      - name: Esperar a que GitHub Pages publique
        run: sleep 60
      - run: node .github/scripts/smoke.js
